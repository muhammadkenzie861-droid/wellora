        .daftar-kartu {

            grid-template-columns: repeat(3, 1fr);

            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 5px;
        }
        .kartu:hover{
            background-color: #f5f5f5;
        }
    </style>
    <main class="daftar-kartu" id="daftar-kartu">

    

    <template id="template-info">
        <a href="#" class="kartu">
            <h2 class="judul"></h2>
            <p class="deskripsi"></p>
        </a>
    </template>
    </main>
    <button id="tombol">Play Music</button>
